title: EBYTE Tech Blog
tagline: 工业物联网无线通信技术分享
description: EBYTE 技术博客，分享 LoRa、WiFi、BLE、ZigBee 等无线通信技术
url: "https://ebyteiot.github.io"
baseurl: ""

# 使用 GitHub 官方内置主题
remote_theme: pages-themes/cayman@v0.2.0

# 插件
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# 语言
lang: zh-CN
timezone: Asia/Shanghai

# 作者
author:
  name: EBYTE
  email: service@cdebyte.com

# 文章链接格式
permalink: /:year/:month/:day/:title/

# 分页
paginate: 10

# 默认设置
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
